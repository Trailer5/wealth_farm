name: Update Daily Data

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: Optional inclusive end date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: wealth-farm-daily-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require daily data repository token
        env:
          DAILY_DATA_TOKEN: ${{ secrets.DAILY_DATA_TOKEN }}
        run: |
          if [ -z "$DAILY_DATA_TOKEN" ]; then
            echo "Repository secret DAILY_DATA_TOKEN is required."
            exit 1
          fi

      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Checkout daily data repository
        uses: actions/checkout@v4
        with:
          repository: Trailer5/wealth_farm_daily_data
          token: ${{ secrets.DAILY_DATA_TOKEN }}
          path: data/daily_data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dependencies/requirement.txt

      - name: Fetch, validate, and write daily data
        env:
          REQUESTED_END_DATE: ${{ inputs.end_date }}
        run: |
          args=()
          if [ -n "$REQUESTED_END_DATE" ]; then
            args+=(--end-date "$REQUESTED_END_DATE")
          fi
          python -m src.daily_data.runner \
            --daily-data-root data/daily_data \
            --database temp/daily_data_update.sqlite3 \
            "${args[@]}"

      - name: Commit and push changed daily data
        working-directory: data/daily_data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No daily_data changes to publish."
            exit 0
          fi
          git \
            -c user.name="wealth-farm-data-bot" \
            -c user.email="wealth-farm-data-bot@users.noreply.github.com" \
            commit -m "update daily market data $(date -u +%F)"
          git push
